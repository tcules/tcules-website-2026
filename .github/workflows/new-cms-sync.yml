# Production comes down to staging: whatever lands on new-cms is offered to main as one PR.
#
# new-cms is production and main is staging (owner, 17 Nov 2026; decisions/2026-11-17-new-cms-is-production-main-is-staging).
# Mihir commits to new-cms directly, so main falls behind production unless something brings that work
# down. This job keeps one PR open from `sync/new-cms` into main whenever new-cms has commits main
# lacks. The direction is one way: main is never merged into new-cms, because main keeps /design and
# production doesn't. Staging changes go up one PR at a time (graphics-carry.yml does that for graphics).
#
# It runs on a schedule, not on push: a scheduled workflow runs from main, so this file never has to
# exist on new-cms. Thirty minutes is quick enough for staging and costs a few seconds a run.
#
# Merge the PR with "Create a merge commit", never squash or rebase. A merge commit records that main
# has new-cms's history; a squash doesn't, so the next sync would replay the same commits and conflict.
#
# On a conflict, the PR says so and nothing is forced. Resolve it on `sync/new-cms` (never on new-cms):
# the next run sees the extra commit and merges new-cms into the branch instead of resetting it.
name: new-cms-sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: new-cms-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: sync/new-cms
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bring new-cms down to the sync branch
        id: sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git merge-base --is-ancestor origin/new-cms origin/main; then
            echo "main already has everything on new-cms."
            echo "behind=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "behind=true" >> "$GITHUB_OUTPUT"
          echo "commits=$(git rev-list --count --no-merges origin/main..origin/new-cms)" >> "$GITHUB_OUTPUT"
          # A sync branch with commits of its own holds someone's conflict resolution: keep it and
          # merge new-cms into it. Otherwise point it at new-cms's tip.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null &&
             [ -n "$(git rev-list "origin/new-cms..origin/$BRANCH" -- 2>/dev/null)" ] &&
             ! git merge-base --is-ancestor "origin/$BRANCH" origin/main; then
            git switch -c "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/new-cms
            git push origin "$BRANCH"
          else
            git push --force origin "origin/new-cms:refs/heads/$BRANCH"
          fi

      - name: Open the PR to main, or leave the open one updated
        if: steps.sync.outputs.behind == 'true'
        run: |
          open=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            echo "PR #$open is open and now carries new-cms's tip."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "Sync new-cms into main" \
            --body "$(printf '%s\n\n%s\n\n%s' \
              "Production (\`new-cms\`) has commits staging (\`main\`) doesn't. This PR brings them down. It was opened by \`new-cms-sync.yml\` and stays up to date by itself until merged." \
              "**Merge with \"Create a merge commit\"**, never squash or rebase, or the next sync replays these commits and conflicts." \
              "If GitHub shows a conflict, resolve it on \`sync/new-cms\` (never on \`new-cms\`). /design and its checks live only on main, so keep main's side for anything under \`src/app/design\`, \`public/design\` and the \`/design\` routes in \`src/lib/routes.ts\`.")"
