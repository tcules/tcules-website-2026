<svg xmlns="http://www.w3.org/2000/svg" viewBox="-330 -93 705 470" role="img" aria-label="Isometric illustration for data and analytics product design. A solid blue tablet lies flat on a dotted floor, and a bar chart of four white bars rises out of its screen. The first bar has grown since last time: its old top is left as a dashed outline and the new height above it is lime, so it is now the tallest bar. A dashed line runs from that growth down the bar and across the screen to a large row beneath the chart, a rising-trend tile with a title and a line of text, that says what changed and why. Two people from different teams stand beside the tablet and point at the same lime growth.">
