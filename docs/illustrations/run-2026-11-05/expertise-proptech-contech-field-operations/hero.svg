<svg xmlns="http://www.w3.org/2000/svg" viewBox="-365.8 -143.8 860.3 574" role="img" aria-label="Isometric illustration for PropTech, ConTech and field operations product design. On a dotted floor the property's one record stands as a tablet on a stand, its screen solid blue: the property's name, a map with its pin, and its sign-offs below, two ticked and one still open. In front of the screen the white house from the expertise hub stands on its lime tile. Two people share that one record from either end of the tablet: someone from the deal desk in a tie rests a hand on its far edge, and a person on site in a hard hat, standing on the floor by the house, rests a hand on the open sign-off.">
