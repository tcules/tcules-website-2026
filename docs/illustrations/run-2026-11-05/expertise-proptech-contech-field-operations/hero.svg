<svg xmlns="http://www.w3.org/2000/svg" viewBox="-157 -247.7 755 508.2" role="img" aria-label="Isometric illustration for PropTech, ConTech and field operations product design. On a dotted floor the property's one record stands as a solid blue screen: the house's map pin at the top, the deal's stages on the left with the current one picked out by a house, and its sign-offs on the right, two ticked and one still open, each beside its source document or drawing. Beside it the white house from the expertise hub stands on its lime tile. Two people work on that one record: someone from the deal desk in a tie rests a hand on the deal's stage, and a person on site in a hard hat, standing on the lime tile by the house, rests a hand by the sign-offs.">
