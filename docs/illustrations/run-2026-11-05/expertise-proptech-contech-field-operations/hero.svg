<svg xmlns="http://www.w3.org/2000/svg" viewBox="-405.4 -216.8 692 423.3" role="img" aria-label="Isometric illustration for PropTech, ConTech and field operations product design. The white house from the expertise hub stands on its lime tile, and behind it rises the property's one record, a solid blue screen with the house's map pin and a list of sign-offs, two ticked and one still open, each beside its source document or drawing. On the left a deal team's laptop shows the same property picked out in a pipeline board; in front on the right a person on site in a hard hat holds up a phone with the same pin and a saved tick. Dashed lines tie the laptop and the phone to the one record.">
