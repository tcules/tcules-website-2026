<svg xmlns="http://www.w3.org/2000/svg" viewBox="-368 -146 865 578" role="img" aria-label="Isometric illustration for ClimateTech and energy product design. A white wind turbine, as on the expertise hub, stands on a dotted floor. One dashed line runs from its foot through a battery with a charge gauge and a lightning bolt, then on, with arrows, into a port on the low console of a monitor with a blue screen. The screen holds one day chart running from a sun to a moon: a solid line of measured readings stops at a now marker, and a dashed forecast climbs over a flat lime target line to a peak tonight, ringed in dots. A solid blue Tcules designer stands at the screen with a short arm raised, a hand resting on the lime target.">
<defs><pattern id="cte-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.6" fill="#8AA5FF"/></pattern></defs>
