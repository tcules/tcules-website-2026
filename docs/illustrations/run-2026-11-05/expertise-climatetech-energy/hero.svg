<svg xmlns="http://www.w3.org/2000/svg" viewBox="-330 -251 783 653" role="img" aria-label="Isometric illustration for ClimateTech and energy product design. A white wind turbine, as on the expertise hub, and a battery with a charge gauge and a lightning bolt feed one dashed line across a dotted floor into a port on a large energy display. Its blue screen holds one day chart running from a sun to a moon: a solid line of measured readings stops at a now marker, a dashed forecast climbs over a flat lime target line to a peak tonight, ringed in dots. A solid blue Tcules designer points at the spot where the forecast breaks the target.">
<defs><pattern id="cte-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.6" fill="#8AA5FF"/></pattern></defs>
