<svg xmlns="http://www.w3.org/2000/svg" viewBox="-429 -357 957 831" role="img" aria-label="Isometric illustration for ClimateTech and energy product design. A white wind turbine, as on the expertise hub, and a battery block feed dashed lines into an energy product standing on a dotted floor: a light monitor whose blue screen holds one chart where a solid line of measured readings stops at a now marker, a dashed line carries the forecast on, and a lime band marks the target. A solid blue Tcules designer points at the chart.">
