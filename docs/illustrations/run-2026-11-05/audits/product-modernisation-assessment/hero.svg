<svg xmlns="http://www.w3.org/2000/svg" viewBox="-419 -239 860 511" role="img" aria-label="Isometric illustration of a product modernisation assessment. An established product, drawn as a solid blue slab, is split into five blocks of different sizes, one for each area of the product, and each block carries a mark for its answer: a tick to keep, a minus to simplify, a turning arrow to redesign, a cross to rebuild or retire. The one to move first, lime and marked with an upward arrow for a new platform, is lifted just clear of its place, and a dashed line runs from it to the blocks that depend on it. A Tcules designer has a hand on the lime block and the client, standing at the slab's other side, has a hand on the block they keep.">
