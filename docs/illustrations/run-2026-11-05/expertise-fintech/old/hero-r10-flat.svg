<svg xmlns="http://www.w3.org/2000/svg" viewBox="-551 -118 975 505" role="img" aria-label="Isometric illustration for FinTech product design. A solid blue bank card with a chip and a contactless mark stands on its edge on a dotted floor, behind a light phone lying face up. A dashed line runs out of the card and drops onto the same card at the head of the phone's screen. Below it the payment's steps: two ticked, the third stopped with a solid warning mark and a note giving the reason, and the next step, retry, lit in lime. A customer stands at the foot of the phone, reaching for it.">
