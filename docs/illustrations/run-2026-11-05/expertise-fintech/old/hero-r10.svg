<svg xmlns="http://www.w3.org/2000/svg" viewBox="-354 -329 852 606" role="img" aria-label="Isometric illustration for FinTech product design. A solid blue bank card with a chip and a contactless mark stands on its edge on a dotted floor. A dashed line runs from the card up and into a light phone standing behind it, ending on the same card at the head of the screen. Below it the payment's steps: two ticked, the third stopped with a solid warning mark and a note giving the reason, then the retry step lit in lime and a faded last step not yet reached. A customer stands beside the phone, reaching for it.">
