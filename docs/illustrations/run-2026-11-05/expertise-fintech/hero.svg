<svg xmlns="http://www.w3.org/2000/svg" viewBox="-333 -349 678 571" role="img" aria-label="Isometric illustration for FinTech product design. A solid blue bank card with a chip and a contactless mark stands on its edge on a dotted floor. A dashed line runs from the card up and into a light phone standing beside it, ending on the chip of the same card at the head of the screen. Below it a payment's steps: two ticked, the third stopped with a solid warning mark and a note hanging from it giving the reason, a faded step not yet reached, and one lime button with an arrow, the way forward.">
