<g transform="matrix(0.9 0.45 0 1 -55.8 -44.1)"><path d="M10 0 H200 V72 H10 A10 10 0 0 1 0 62 V10 A10 10 0 0 1 10 0 Z" fill="#0048FF" stroke="#003EE0" stroke-width="1.6" stroke-linejoin="round"/><rect x="22" y="18" width="104" height="34" rx="8" fill="#FFFFFF"/><rect x="34" y="31.5" width="48" height="8" rx="4" fill="#0048FF"/><rect x="92" y="28" width="24" height="15" rx="7.5" fill="#DBE4FF"/><circle cx="99" cy="35.5" r="2.4" fill="#0048FF"/><circle cx="109" cy="35.5" r="2.4" fill="#0048FF"/></g>
