<svg xmlns="http://www.w3.org/2000/svg" viewBox="-348 -209 602 420" role="img" aria-label="Isometric illustration for B2B SaaS and workflow software design. A solid blue expanding file stands on a dotted floor, its dividers tabbed for the roles that share one deal: two people and one marked AI. The deal record has been taken out of its slot, where a dashed outline remains, and is being handed on: a Tcules designer passes it to a client, both holding its edges. The record shows its owner, a row of stages with the current one in lime and a value field, and its lime tab carries an arrow pointing the way it is going.">
<defs><pattern id="bs-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.6" fill="#0048FF" fill-opacity="0.38"/></pattern></defs>
<!-- Floor: healthtech's plate, dotted, a soft inset, a dashed edge -->
<g transform="matrix(0.9 0.45 -0.9 0.45 -108.0 -90.0)"><rect width="395" height="260" fill="url(#bs-dots)"/><rect width="395" height="260" fill="none" stroke="#0048FF" stroke-width="1.8" stroke-dasharray="10 8"/><rect x="45" y="45" width="305" height="170" fill="#0048FF" fill-opacity="0.07"/></g>
<!-- The deal file: a solid blue expanding file. Back board: one shape, top corners rounded -->
<g transform="matrix(0.9 0.45 0 1 0.0 -186.0)"><path d="M0 186 V12 A12 12 0 0 1 12 0 H188 A12 12 0 0 1 200 12 V186 Z" fill="#0048FF" stroke="#003EE0" stroke-width="1.6" stroke-linejoin="round"/></g>
<!-- The slot the record left: the dashed top edge and tab of the missing sheet -->
<g transform="matrix(0.9 0.45 0 1 -1.8 -156.8)"><path d="M0 26 V9 A9 9 0 0 1 9 0 H16 V-15 A7 7 0 0 1 23 -22 H59 A7 7 0 0 1 66 -15 V0 H177 A9 9 0 0 1 186 9 V26" fill="none" stroke="#D7F04A" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- Dividers, one tabbed for each role: a person, a person, an AI agent -->
<g transform="matrix(0.9 0.45 0 1 -13.5 -132.9)"><path d="M0 9 A9 9 0 0 1 9 0 H40.0 V-17 A7 7 0 0 1 47.0 -24 H73.0 A7 7 0 0 1 80.0 -17 V0 H177 A9 9 0 0 1 186 9 V137 A9 9 0 0 1 177 146 H9 A9 9 0 0 1 0 137 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><circle cx="60" cy="-15.5" r="4.4" fill="#0048FF"/><path d="M52.5 -4.5 a7.5 6.6 0 0 1 15 0 Z" fill="#0048FF"/><rect x="16" y="12" width="66" height="7" rx="3.5" fill="#B8C8FF"/></g>
<g transform="matrix(0.9 0.45 0 1 -25.2 -127.1)"><path d="M0 9 A9 9 0 0 1 9 0 H83.0 V-17 A7 7 0 0 1 90.0 -24 H116.0 A7 7 0 0 1 123.0 -17 V0 H177 A9 9 0 0 1 186 9 V137 A9 9 0 0 1 177 146 H9 A9 9 0 0 1 0 137 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><circle cx="103" cy="-15.5" r="4.4" fill="#0048FF"/><path d="M95.5 -4.5 a7.5 6.6 0 0 1 15 0 Z" fill="#0048FF"/><rect x="16" y="12" width="66" height="7" rx="3.5" fill="#B8C8FF"/></g>
<g transform="matrix(0.9 0.45 0 1 -36.9 -121.2)"><path d="M0 9 A9 9 0 0 1 9 0 H126.0 V-17 A7 7 0 0 1 133.0 -24 H159.0 A7 7 0 0 1 166.0 -17 V0 H177 A9 9 0 0 1 186 9 V137 A9 9 0 0 1 177 146 H9 A9 9 0 0 1 0 137 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><rect x="132" y="-19.5" width="28" height="15" rx="7.5" fill="#0048FF"/><path d="M139 -7.6 l3.3 -8.2 l3.3 8.2 M140.3 -10.4 h4 M150 -15.8 v8.2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="12" width="66" height="7" rx="3.5" fill="#B8C8FF"/></g>
