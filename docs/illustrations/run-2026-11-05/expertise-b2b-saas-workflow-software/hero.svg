<svg xmlns="http://www.w3.org/2000/svg" viewBox="-371 -144 864 522" role="img" aria-label="Isometric illustration for B2B SaaS and workflow software design. A white expanding file with a blue label stands on a dotted floor, its dividers tabbed for the roles that share one deal: two people and one marked AI. One sheet, the deal record with a lime tab, has been taken out, leaving a dashed outline of its tab in the file, and lies on a low table in front of it: the person who took it out slides it along the table to the next person, each with a hand on one end. The record shows its owner and a row of stages, with the current one ringed.">
<defs><pattern id="bs-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.6" fill="#0048FF" fill-opacity="0.38"/></pattern></defs>
<!-- Floor: healthtech's plate, dotted, a soft inset, a dashed edge -->
<g transform="matrix(0.9 0.45 -0.9 0.45 -3.6 -54.0)"><rect width="545" height="402" fill="url(#bs-dots)"/><rect width="545" height="402" fill="none" stroke="#0048FF" stroke-width="1.8" stroke-dasharray="10 8"/><rect x="45" y="45" width="455" height="312" fill="#0048FF" fill-opacity="0.07"/></g>
<!-- The deal file: a white expanding file, blue outline. Back board: one shape, top corners rounded -->
<g transform="matrix(0.9 0.45 0 1 0.0 -138.0)"><path d="M0 138 V11 A11 11 0 0 1 11 0 H139 A11 11 0 0 1 150 11 V138 Z" fill="#DBE4FF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/></g>
<!-- The slot the record left: a dashed outline of its tab, standing empty behind the dividers -->
<g transform="matrix(0.9 0.45 0 1 -0.9 -107.2)"><path d="M101.0 6 V-14 A6 6 0 0 1 107.0 -20 H125.0 A6 6 0 0 1 131.0 -14 V6" fill="none" stroke="#0048FF" stroke-width="1.6" stroke-dasharray="3.5 3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- Dividers, one tabbed for each role: a person, a person, an AI agent -->
<g transform="matrix(0.9 0.45 0 1 -9.9 -96.8)"><path d="M0 8 A8 8 0 0 1 8 0 H9.0 V-16 A6 6 0 0 1 15.0 -22 H33.0 A6 6 0 0 1 39.0 -16 V0 H128 A8 8 0 0 1 136 8 V100 A8 8 0 0 1 128 108 H8 A8 8 0 0 1 0 100 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><circle cx="24" cy="-14" r="4" fill="#0048FF"/><path d="M17.2 -4 a6.8 6 0 0 1 13.6 0 Z" fill="#0048FF"/></g>
<g transform="matrix(0.9 0.45 0 1 -20.7 -91.3)"><path d="M0 8 A8 8 0 0 1 8 0 H41.0 V-16 A6 6 0 0 1 47.0 -22 H65.0 A6 6 0 0 1 71.0 -16 V0 H128 A8 8 0 0 1 136 8 V100 A8 8 0 0 1 128 108 H8 A8 8 0 0 1 0 100 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><circle cx="56" cy="-14" r="4" fill="#0048FF"/><path d="M49.2 -4 a6.8 6 0 0 1 13.6 0 Z" fill="#0048FF"/></g>
<g transform="matrix(0.9 0.45 0 1 -31.5 -86.0)"><path d="M0 8 A8 8 0 0 1 8 0 H73.0 V-16 A6 6 0 0 1 79.0 -22 H97.0 A6 6 0 0 1 103.0 -16 V0 H128 A8 8 0 0 1 136 8 V100 A8 8 0 0 1 128 108 H8 A8 8 0 0 1 0 100 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><rect x="75.5" y="-17.5" width="25" height="13.5" rx="6.75" fill="#0048FF"/><path d="M81.7 -6.9 l3 -7.4 l3 7.4 M82.9 -9.4 h3.6 M91.6 -14.3 v7.4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- The gusset: an accordion of folds, pale side faces -->
<polygon points="135.0,67.5 135.0,-42.5 126.9,-17.1 118.8,-17.7 110.7,7.7 102.6,7.0 94.5,32.4 86.4,31.8 86.4,91.8" fill="#B8C8FF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M126.9,-17.1 126.9,71.5" stroke="#0048FF" stroke-width="1.2" stroke-linecap="round"/>
<path d="M110.7,7.7 110.7,79.7" stroke="#0048FF" stroke-width="1.2" stroke-linecap="round"/>
<path d="M94.5,32.4 94.5,87.8" stroke="#0048FF" stroke-width="1.2" stroke-linecap="round"/>
<path d="M118.8,-14.2 118.8,74.1" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
<path d="M102.6,10.5 102.6,82.2" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
<!-- Front pocket, white; its label slip is the file's one solid blue part -->
<polygon points="-35.1,-34.3 91.8,29.1 86.4,31.8 -40.5,-31.6" fill="#B8C8FF" stroke="#0048FF" stroke-width="1.2" stroke-linejoin="round"/>
<g transform="matrix(0.9 0.45 0 1 -48.6 -35.7)"><path d="M9 0 H150 V60 H9 A9 9 0 0 1 0 51 V9 A9 9 0 0 1 9 0 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><rect x="18" y="15" width="70" height="24" rx="6" fill="#0048FF"/><rect x="28" y="24" width="38" height="6" rx="3" fill="#FFFFFF"/></g>
<!-- The person who drew the record from the file stands at the table's near end -->
<path d="M-45.4 180.0 V118.0 A22 22 0 0 1 -1.4 118.0 V180.0 A22 9.9 0 0 1 -45.4 180.0 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><circle cx="-23.4" cy="76.0" r="16" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6"/>
<!-- A low table: white top, pale sides, four legs -->
<polygon points="47.7,184.1 54.0,187.2 54.0,154.2 47.7,151.1" fill="#B8C8FF" stroke="#0048FF" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="60.3,184.1 54.0,187.2 54.0,154.2 60.3,151.1" fill="#DBE4FF" stroke="#0048FF" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="176.4,248.4 182.7,251.6 182.7,218.6 176.4,215.4" fill="#B8C8FF" stroke="#0048FF" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="189.0,248.4 182.7,251.6 182.7,218.6 189.0,215.4" fill="#DBE4FF" stroke="#0048FF" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="-21.6,218.7 -15.3,221.9 -15.3,188.9 -21.6,185.7" fill="#B8C8FF" stroke="#0048FF" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="-9.0,218.7 -15.3,221.9 -15.3,188.9 -9.0,185.7" fill="#DBE4FF" stroke="#0048FF" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="107.1,283.1 113.4,286.2 113.4,253.2 107.1,250.1" fill="#B8C8FF" stroke="#0048FF" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="119.7,283.1 113.4,286.2 113.4,253.2 119.7,250.1" fill="#DBE4FF" stroke="#0048FF" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="-32.4,185.7 113.4,258.6 113.4,251.6 -32.4,178.7" fill="#B8C8FF" stroke="#0048FF" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="199.8,215.4 113.4,258.6 113.4,251.6 199.8,208.4" fill="#DBE4FF" stroke="#0048FF" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="54.0,135.5 199.8,208.4 113.4,251.6 -32.4,178.7" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/>
<!-- The deal record lying on the table: the sheet missing from the file, its tab lime -->
<g transform="matrix(0.9 0.45 -0.9 0.45 53.1 147.7)"><path d="M52.0 4 V-16 A6 6 0 0 1 58.0 -22 H90.0 A6 6 0 0 1 96.0 -16 V4 Z" fill="#D7F04A" stroke="#A1B71F" stroke-width="1.4" stroke-linejoin="round"/><rect x="65" y="-14.0" width="18" height="5" rx="2.5" fill="#1B1B18"/><rect width="136" height="74" rx="8" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6"/><circle cx="22" cy="21" r="8.5" fill="#0048FF"/><circle cx="22" cy="18.6" r="3" fill="#FFFFFF"/><path d="M17 26.4 a5 4.4 0 0 1 10 0 Z" fill="#FFFFFF"/><rect x="37" y="15" width="64" height="7.5" rx="3.75" fill="#0048FF"/><rect x="37" y="26" width="38" height="6" rx="3" fill="#B8C8FF"/><path d="M24 53 H112" stroke="#B8C8FF" stroke-width="2.2" stroke-linecap="round"/><path d="M24 53 H82.7" stroke="#0048FF" stroke-width="2.2" stroke-linecap="round"/><circle cx="24" cy="53" r="5" fill="#0048FF"/><circle cx="53.3" cy="53" r="5" fill="#0048FF"/><circle cx="82.7" cy="53" r="6.5" fill="#FFFFFF" stroke="#0048FF" stroke-width="2.4"/><circle cx="112" cy="53" r="5" fill="#FFFFFF" stroke="#8AA5FF" stroke-width="1.4"/></g>
<!-- The giver's hand pushes the record across; the next person's hand takes its far end -->
<mask id="bs-arm0" maskUnits="userSpaceOnUse" x="-600" y="-400" width="1400" height="1000"><rect x="-600" y="-400" width="1400" height="1000" fill="#FFFFFF"/><path d="M-45.4 180.0 V118.0 A22 22 0 0 1 -1.4 118.0 V180.0 A22 9.9 0 0 1 -45.4 180.0 Z" fill="#000000"/></mask><g mask="url(#bs-arm0)"><path d="M-17.4 140.0 L26.1 163.8" stroke="#0048FF" stroke-width="11" stroke-linecap="round"/><circle cx="26.1" cy="163.8" r="8.8" fill="#0048FF"/></g><path d="M-17.4 140.0 L26.1 163.8" stroke="#FFFFFF" stroke-width="7.8" stroke-linecap="round"/><circle cx="26.1" cy="163.8" r="7.2" fill="#FFFFFF"/>
<!-- The next person, at the far end -->
<path d="M168.8 287.1 V225.1 A22 22 0 0 1 212.8 225.1 V287.1 A22 9.9 0 0 1 168.8 287.1 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><circle cx="190.8" cy="183.1" r="16" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6"/>
<mask id="bs-arm1" maskUnits="userSpaceOnUse" x="-600" y="-400" width="1400" height="1000"><rect x="-600" y="-400" width="1400" height="1000" fill="#FFFFFF"/><path d="M168.8 287.1 V225.1 A22 22 0 0 1 212.8 225.1 V287.1 A22 9.9 0 0 1 168.8 287.1 Z" fill="#000000"/></mask><g mask="url(#bs-arm1)"><path d="M184.8 247.1 L141.3 221.4" stroke="#0048FF" stroke-width="11" stroke-linecap="round"/><circle cx="141.3" cy="221.4" r="8.8" fill="#0048FF"/></g><path d="M184.8 247.1 L141.3 221.4" stroke="#FFFFFF" stroke-width="7.8" stroke-linecap="round"/><circle cx="141.3" cy="221.4" r="7.2" fill="#FFFFFF"/>
</svg>
