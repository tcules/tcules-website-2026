<g transform="matrix(0.9 0.45 0 1 -252.0 -100.8)"><path d="M14 4 V-19 A7 7 0 0 1 21 -26 H71 A7 7 0 0 1 78 -19 V4 Z" fill="#D7F04A" stroke="#A1B71F" stroke-width="1.6" stroke-linejoin="round"/><path d="M62 -12.5 H30 M37 -18.5 L30 -12.5 L37 -6.5" fill="none" stroke="#1B1B18" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect width="168" height="100" rx="9" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6"/><circle cx="24" cy="23" r="9" fill="#0048FF"/><circle cx="24" cy="20.4" r="3.2" fill="#FFFFFF"/><path d="M18.6 28.6 a5.4 4.8 0 0 1 10.8 0 Z" fill="#FFFFFF"/><rect x="40" y="16" width="78" height="8" rx="4" fill="#0048FF"/><rect x="40" y="28" width="46" height="6" rx="3" fill="#B8C8FF"/><path d="M22 54 H146" stroke="#B8C8FF" stroke-width="2.2" stroke-linecap="round"/><path d="M22 54 H84" stroke="#0048FF" stroke-width="2.2" stroke-linecap="round"/><circle cx="22" cy="54" r="5.5" fill="#0048FF"/><circle cx="53" cy="54" r="5.5" fill="#0048FF"/><circle cx="115" cy="54" r="5.5" fill="#FFFFFF" stroke="#8AA5FF" stroke-width="1.4"/><circle cx="146" cy="54" r="5.5" fill="#FFFFFF" stroke="#8AA5FF" stroke-width="1.4"/><circle cx="84" cy="54" r="7.5" fill="#D7F04A" stroke="#A1B71F" stroke-width="1.4"/><rect x="16" y="74" width="136" height="24" rx="6" fill="#EEF2FF" stroke="#DBE4FF" stroke-width="1.2"/><rect x="26" y="83" width="22" height="6" rx="3" fill="#8AA5FF"/><rect x="84" y="81.5" width="58" height="9" rx="4.5" fill="#0048FF"/></g>
