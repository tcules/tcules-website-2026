<svg xmlns="http://www.w3.org/2000/svg" viewBox="-377 -142 642 427" role="img" aria-label="Isometric illustration for B2B SaaS and workflow software design. A solid blue expanding file stands on a dotted floor, its dividers tabbed for the roles that share one deal: two people and one marked AI. One sheet, the deal record with a lime tab, has been taken out, leaving a dashed outline of its tab in the file, and is being handed on: the person beside the file passes it to the next person, both holding its edges. The record shows its owner and a row of stages, with the current one ringed.">
<defs><pattern id="bs-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.6" fill="#0048FF" fill-opacity="0.38"/></pattern></defs>
<!-- Floor: healthtech's plate, dotted, a soft inset, a dashed edge -->
<g transform="matrix(0.9 0.45 -0.9 0.45 10.8 -36.0)"><rect width="278" height="426" fill="url(#bs-dots)"/><rect width="278" height="426" fill="none" stroke="#0048FF" stroke-width="1.8" stroke-dasharray="10 8"/><rect x="45" y="45" width="188" height="336" fill="#0048FF" fill-opacity="0.07"/></g>
<!-- The deal file: a solid blue expanding file. Back board: one shape, top corners rounded -->
<g transform="matrix(0.9 0.45 0 1 0.0 -138.0)"><path d="M0 138 V11 A11 11 0 0 1 11 0 H139 A11 11 0 0 1 150 11 V138 Z" fill="#0048FF" stroke="#003EE0" stroke-width="1.6" stroke-linejoin="round"/></g>
<!-- The slot the record left: a dashed lime outline of its tab, standing empty behind the dividers -->
<g transform="matrix(0.9 0.45 0 1 -0.9 -107.2)"><path d="M101.0 6 V-14 A6 6 0 0 1 107.0 -20 H125.0 A6 6 0 0 1 131.0 -14 V6" fill="none" stroke="#D7F04A" stroke-width="1.8" stroke-dasharray="4.5 3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- Dividers, one tabbed for each role: a person, a person, an AI agent -->
<g transform="matrix(0.9 0.45 0 1 -9.9 -96.8)"><path d="M0 8 A8 8 0 0 1 8 0 H9.0 V-16 A6 6 0 0 1 15.0 -22 H33.0 A6 6 0 0 1 39.0 -16 V0 H128 A8 8 0 0 1 136 8 V100 A8 8 0 0 1 128 108 H8 A8 8 0 0 1 0 100 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><circle cx="24" cy="-14" r="4" fill="#0048FF"/><path d="M17.2 -4 a6.8 6 0 0 1 13.6 0 Z" fill="#0048FF"/></g>
<g transform="matrix(0.9 0.45 0 1 -20.7 -91.3)"><path d="M0 8 A8 8 0 0 1 8 0 H41.0 V-16 A6 6 0 0 1 47.0 -22 H65.0 A6 6 0 0 1 71.0 -16 V0 H128 A8 8 0 0 1 136 8 V100 A8 8 0 0 1 128 108 H8 A8 8 0 0 1 0 100 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><circle cx="56" cy="-14" r="4" fill="#0048FF"/><path d="M49.2 -4 a6.8 6 0 0 1 13.6 0 Z" fill="#0048FF"/></g>
<g transform="matrix(0.9 0.45 0 1 -31.5 -86.0)"><path d="M0 8 A8 8 0 0 1 8 0 H73.0 V-16 A6 6 0 0 1 79.0 -22 H97.0 A6 6 0 0 1 103.0 -16 V0 H128 A8 8 0 0 1 136 8 V100 A8 8 0 0 1 128 108 H8 A8 8 0 0 1 0 100 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><rect x="75.5" y="-17.5" width="25" height="13.5" rx="6.75" fill="#0048FF"/><path d="M81.7 -6.9 l3 -7.4 l3 7.4 M82.9 -9.4 h3.6 M91.6 -14.3 v7.4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- The gusset: an accordion of folds -->
<polygon points="135.0,67.5 135.0,-42.5 126.9,-17.1 118.8,-17.7 110.7,7.7 102.6,7.0 94.5,32.4 86.4,31.8 86.4,91.8" fill="#003EE0" stroke="#0031B0" stroke-width="1.2" stroke-linejoin="round"/>
<path d="M126.9,-17.1 126.9,71.5" stroke="#0031B0" stroke-width="1.5" stroke-linecap="round"/>
<path d="M110.7,7.7 110.7,79.7" stroke="#0031B0" stroke-width="1.5" stroke-linecap="round"/>
<path d="M94.5,32.4 94.5,87.8" stroke="#0031B0" stroke-width="1.5" stroke-linecap="round"/>
<path d="M118.8,-16.2 118.8,75.6" stroke="#0048FF" stroke-width="1.3" stroke-linecap="round"/>
<path d="M102.6,8.5 102.6,83.7" stroke="#0048FF" stroke-width="1.3" stroke-linecap="round"/>
<!-- Front pocket with a plain label slip -->
<polygon points="-35.1,-34.3 91.8,29.1 86.4,31.8 -40.5,-31.6" fill="#0031B0" stroke="#0031B0" stroke-width="1.2" stroke-linejoin="round"/>
<g transform="matrix(0.9 0.45 0 1 -48.6 -35.7)"><path d="M9 0 H150 V60 H9 A9 9 0 0 1 0 51 V9 A9 9 0 0 1 9 0 Z" fill="#0048FF" stroke="#003EE0" stroke-width="1.6" stroke-linejoin="round"/><rect x="20" y="17" width="64" height="20" rx="5" fill="#FFFFFF"/><rect x="29" y="24" width="36" height="6" rx="3" fill="#B8C8FF"/></g>
<!-- The person who drew the record from the file (back) hands it to the next person (front) -->
<path d="M57.2 138.6 V76.6 A22 22 0 0 1 101.2 76.6 V138.6 A22 9.9 0 0 1 57.2 138.6 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><circle cx="79.2" cy="34.6" r="16" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6"/>
<mask id="bs-arm0" maskUnits="userSpaceOnUse" x="-500" y="-300" width="1100" height="800"><rect x="-500" y="-300" width="1100" height="800" fill="#FFFFFF"/><path d="M57.2 138.6 V76.6 A22 22 0 0 1 101.2 76.6 V138.6 A22 9.9 0 0 1 57.2 138.6 Z" fill="#000000"/></mask><g mask="url(#bs-arm0)"><path d="M71.2 98.6 L36.9 95.8" stroke="#0048FF" stroke-width="11" stroke-linecap="round"/><circle cx="36.9" cy="95.8" r="8.8" fill="#0048FF"/></g><path d="M71.2 98.6 L36.9 95.8" stroke="#FFFFFF" stroke-width="7.8" stroke-linecap="round"/><circle cx="36.9" cy="95.8" r="7.2" fill="#FFFFFF"/>
<!-- The deal record: the sheet missing from the file, its tab lime -->
<g transform="matrix(0.9 -0.45 0 1 -82.8 119.6)"><path d="M8.0 4 V-16 A6 6 0 0 1 14.0 -22 H46.0 A6 6 0 0 1 52.0 -16 V4 Z" fill="#D7F04A" stroke="#A1B71F" stroke-width="1.4" stroke-linejoin="round"/><rect x="21" y="-14.0" width="18" height="5" rx="2.5" fill="#1B1B18"/><rect width="136" height="74" rx="8" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6"/><circle cx="22" cy="21" r="8.5" fill="#0048FF"/><circle cx="22" cy="18.6" r="3" fill="#FFFFFF"/><path d="M17 26.4 a5 4.4 0 0 1 10 0 Z" fill="#FFFFFF"/><rect x="37" y="15" width="64" height="7.5" rx="3.75" fill="#0048FF"/><rect x="37" y="26" width="38" height="6" rx="3" fill="#B8C8FF"/><path d="M24 53 H112" stroke="#B8C8FF" stroke-width="2.2" stroke-linecap="round"/><path d="M24 53 H82.7" stroke="#0048FF" stroke-width="2.2" stroke-linecap="round"/><circle cx="24" cy="53" r="5" fill="#0048FF"/><circle cx="53.3" cy="53" r="5" fill="#0048FF"/><circle cx="82.7" cy="53" r="6.5" fill="#FFFFFF" stroke="#0048FF" stroke-width="2.4"/><circle cx="112" cy="53" r="5" fill="#FFFFFF" stroke="#8AA5FF" stroke-width="1.4"/></g>
<circle cx="36.9" cy="95.8" r="8.8" fill="#0048FF"/><circle cx="36.9" cy="95.8" r="7.2" fill="#FFFFFF"/>
<path d="M-144.4 239.4 V177.4 A22 22 0 0 1 -100.4 177.4 V239.4 A22 9.9 0 0 1 -144.4 239.4 Z" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6" stroke-linejoin="round"/><circle cx="-122.4" cy="135.4" r="16" fill="#FFFFFF" stroke="#0048FF" stroke-width="1.6"/>
<mask id="bs-arm1" maskUnits="userSpaceOnUse" x="-500" y="-300" width="1100" height="800"><rect x="-500" y="-300" width="1100" height="800" fill="#FFFFFF"/><path d="M-144.4 239.4 V177.4 A22 22 0 0 1 -100.4 177.4 V239.4 A22 9.9 0 0 1 -144.4 239.4 Z" fill="#000000"/></mask><g mask="url(#bs-arm1)"><path d="M-114.4 199.4 L-80.1 154.2" stroke="#0048FF" stroke-width="11" stroke-linecap="round"/><circle cx="-80.1" cy="154.2" r="8.8" fill="#0048FF"/></g><path d="M-114.4 199.4 L-80.1 154.2" stroke="#FFFFFF" stroke-width="7.8" stroke-linecap="round"/><circle cx="-80.1" cy="154.2" r="7.2" fill="#FFFFFF"/>
</svg>
