<svg xmlns="http://www.w3.org/2000/svg" viewBox="-309 -162 693 509" role="img" aria-label="Isometric illustration for ecommerce UX design for technical parts. A product page lies flat on a dotted floor as a solid blue tablet: a machined flange stands on its picture with a bracket across its width and a lime check on it, and beside it three facts with their own marks (it fits, it is in stock, it arrives) sit under a blue add button. A buyer stands at the corner of the page with a hand on that button, and a dashed line runs from the button over the page edge and across the floor into a white shopping bag, where a parcel printed with the same flange stands ready.">
