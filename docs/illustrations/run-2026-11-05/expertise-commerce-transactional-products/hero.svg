<svg xmlns="http://www.w3.org/2000/svg" viewBox="-368 -142 865 575" role="img" aria-label="Isometric illustration for ecommerce UX design for technical parts. An open laptop stands on a dotted floor showing a product page: a machined flange drawn in elevation with a bracket across its width and a lime check on it, three facts with their own marks (it fits, it is in stock, it arrives), the price and an add button. A buyer stands at the corner of the laptop with a hand on it, and a dashed line arcs from the add button down into a white shopping bag beside the laptop, where a parcel printed with the same flange stands ready.">
