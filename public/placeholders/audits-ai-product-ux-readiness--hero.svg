<text x="314" y="500" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="49" fill="#2B323D"><tspan x="314" dy="0">An AI feature about to reach every</tspan><tspan x="314" dy="71">user, pushed where it is unsure: its</tspan><tspan x="314" dy="71">output, the source it should show, the</tspan><tspan x="314" dy="71">check and the undo a person needs, and</tspan><tspan x="314" dy="71">the places where the person cannot yet</tspan><tspan x="314" dy="71">tell or reverse what the AI did,</tspan><tspan x="314" dy="71">marked before launch.</tspan></text>
