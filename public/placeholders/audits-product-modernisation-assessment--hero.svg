<rect x="1" y="1" width="1598" height="1278" fill="none" stroke="#BFC5CF" stroke-width="2" stroke-dasharray="38 38"/>
<text x="314" y="392" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="38" letter-spacing="3.8" fill="#4A5361">IMAGE TO COME · ILLUSTRATION</text>
<text x="314" y="500" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="49" fill="#2B323D"><tspan x="314" dy="0">An established product split into its</tspan><tspan x="314" dy="71">areas, each given one of five answers</tspan><tspan x="314" dy="71">(keep, simplify, redesign, new</tspan><tspan x="314" dy="71">platform, rebuild or retire), the</tspan><tspan x="314" dy="71">workflows customers rely on held</tspan><tspan x="314" dy="71">intact, and the order of work set by</tspan><tspan x="314" dy="71">what depends on what.</tspan></text>
</svg>
