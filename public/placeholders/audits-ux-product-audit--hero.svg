<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" width="1600" height="1280" role="img" aria-label="Image to come · illustration">
<rect width="1600" height="1280" fill="#EEF0F3"/>
<rect x="1" y="1" width="1598" height="1278" fill="none" stroke="#BFC5CF" stroke-width="2" stroke-dasharray="38 38"/>
<text x="314" y="428" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="38" letter-spacing="3.8" fill="#4A5361">IMAGE TO COME · ILLUSTRATION</text>
<text x="314" y="536" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="49" fill="#2B323D"><tspan x="314" dy="0">One workflow in a live product walked</tspan><tspan x="314" dy="71">role by role, the places people stall</tspan><tspan x="314" dy="71">marked, each traced to its cause and</tspan><tspan x="314" dy="71">the causes ranked by harm, so a team</tspan><tspan x="314" dy="71">that disagreed about why can agree</tspan><tspan x="314" dy="71">what to fix first.</tspan></text>
</svg>
