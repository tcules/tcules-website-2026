<text x="114" y="298" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="76" letter-spacing="7.6" fill="#4A5361">ILLUSTRATION TO COME</text>
<text x="114" y="487" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="86" fill="#2B323D"><tspan x="114" dy="0">Several directions explored</tspan><tspan x="114" dy="125">side by side, one carried to</tspan><tspan x="114" dy="125">finish: a screen that reads at</tspan><tspan x="114" dy="125">a glance, responds, and shows</tspan><tspan x="114" dy="125">a considered empty and error</tspan><tspan x="114" dy="125">state.</tspan></text>
