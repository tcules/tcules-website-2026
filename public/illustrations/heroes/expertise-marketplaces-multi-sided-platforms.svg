<svg xmlns="http://www.w3.org/2000/svg" viewBox="-510 -170 860 630" role="img" aria-label="Isometric illustration for marketplace product design. A balance scale stands on a dotted floor, its blue beam held level at one lime booking with a tick. On the left pan stands the buyer's app, showing a provider with a portrait, a row of stars and a book button; on the right pan stands the provider's app, showing a request with a place, a time and an accept button. A buyer stands at the left pan and a provider at the right, each reaching to their own app, and a blue Tcules designer stands at the scale's foot.">
