<svg xmlns="http://www.w3.org/2000/svg" width="820" height="627" viewBox="0 101 820 627" role="img" aria-label="Isometric illustration for Expertise. A product screen stands quietly at the back in pale tones. In front, a clear sheet floats forward, joined to it by dashed lines, carrying only the problems, each marked where it sits on the product. The marks come in three sizes by how much each one hurts: small rings, solid discs, and one large lime ring for the worst. Fine dashed lines drop each mark back to its place on the screen. A solid blue Tcules person stands on the pale tint in front, pointing at the clear sheet." style="display: block"><style>.sm rect,.sm path,.sm circle{vector-effect:non-scaling-stroke}</style>
