<svg xmlns="http://www.w3.org/2000/svg" viewBox="-512 -126 865 584" role="img" aria-label="Isometric illustration for content and knowledge platform design. On a dotted floor stands a white library card catalogue of eight labelled drawers, with a blue search field lying on its lid. A dashed line runs from the search field, straight down from its magnifier, to one card lifted out of an open drawer and ringed in a dotted outline, landing on the card's lime tab that marks it as the current version. The card shows its owner and a link mark for its source, while the faded cards stay in the drawer below. A client stands beside the drawer and reaches up to take that card.">
<defs><pattern id="ckd-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.6" fill="#0048FF" fill-opacity="0.38"/></pattern></defs>
