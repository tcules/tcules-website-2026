<svg xmlns="http://www.w3.org/2000/svg" viewBox="-433 -340 865 556" role="img" aria-label="Isometric illustration for a design-to-code audit. On a dotted floor, a monitor showing the approved design stands beside a laptop running the shipped product, both with dark blue screens laid out the same way. Dashed lines match each part of the design to the same part on the laptop: the title, the picture, the button. The wide button is lime on the design, but on the laptop its place is only an empty dashed outline. A client developer standing at the monitor has a hand on the lime button; a Tcules designer standing at the laptop has a hand on the empty place where it should be.">
